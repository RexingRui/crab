<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班级积分</title>
<style>
:root{
  --paper:#F2F4F1;
  --surface:#FFFFFF;
  --ink:#1C2A25;
  --ink2:#45524C;
  --muted:#7B8580;
  --line:#D9DED9;
  --line2:#E8EBE7;
  --board:#22423A;
  --board2:#2C564B;
  --board-tint:#EAF2EE;
  --plus:#1B7F55;
  --plus-bg:#E3F2EA;
  --minus:#BF4529;
  --minus-bg:#FBE9E3;
  --gold-bg:#FBF2DA;
  --chalk:#EDEFE6;
  --chalk-y:#F2D16B;
  --chalk-p:#F0A99F;
  --chalk-g:#A6DDBA;
  --font:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Micro Hei",sans-serif;
  --kai:"KaiTi","STKaiti","Kaiti SC","KaiTi_GB2312","楷体","AR PL UKai CN","AR PL KaitiM GB",var(--font);
  --num:"Bahnschrift","DIN Alternate","Roboto Condensed","Segoe UI","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
body.in-display{overflow:hidden}
body.in-display .toasts{display:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #3B7A66;outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.pos{color:var(--plus)}
.neg{color:var(--minus)}
.muted{color:var(--muted)}
.grow{flex:1}
.r{text-align:right}
[hidden]{display:none!important}

/* 顶栏 */
.top{position:sticky;top:0;z-index:20;background:var(--board);color:var(--chalk);display:flex;align-items:center;gap:22px;padding:0 20px;height:58px}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand .cls{font-family:var(--kai);font-size:24px;letter-spacing:.04em}
.brand .sub{font-size:13px;opacity:.6}
.tabs{display:flex;gap:2px;height:100%;overflow-x:auto}
.tab{background:none;border:0;padding:0 13px;height:100%;color:rgba(237,239,230,.68);position:relative;font-size:15px;white-space:nowrap}
.tab:hover{color:#fff}
.tab.on{color:#fff;font-weight:600}
.tab.on::after{content:"";position:absolute;left:11px;right:11px;bottom:9px;height:3px;border-radius:2px;background:var(--chalk-y)}
.btn-show{background:var(--chalk-y);color:#2B2810;border:0;border-radius:8px;height:36px;padding:0 16px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.btn-show:hover{background:#F6DB85}
.btn-win{background:transparent;color:var(--chalk);border:1px solid rgba(237,239,230,.3);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;padding:0}
.btn-win:hover{border-color:rgba(237,239,230,.6)}
.top svg,.btn svg{width:18px;height:18px}

/* 通用 */
.page{padding:16px 20px 40px;max-width:1600px;margin:0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;font-size:14px}
.btn:hover{border-color:#B6C0BA;background:#FAFBFA}
.btn.primary{background:var(--board);border-color:var(--board);color:#fff}
.btn.primary:hover{background:var(--board2);border-color:var(--board2)}
.btn.danger{color:var(--minus);border-color:#EBC3B8}
.btn.danger:hover{background:var(--minus-bg)}
.btn.danger-fill{background:var(--minus);border-color:var(--minus);color:#fff}
.btn.sm{height:30px;padding:0 11px;font-size:13px}
.btn.block{width:100%}
.btn:disabled,.btn:disabled:hover{opacity:.45;cursor:not-allowed;background:var(--surface);border-color:var(--line)}
.btn.primary:disabled{background:var(--board);border-color:var(--board)}
.link{background:none;border:0;padding:2px 4px;color:var(--board2);font-size:13px}
.link:hover{text-decoration:underline}
.link.danger{color:var(--minus)}
.link.strong{font-weight:600;font-size:14px;color:var(--ink);padding:0}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar.sec{margin-top:8px}
.search{position:relative;flex:1;min-width:200px;max-width:420px;display:block}
.search.sm{max-width:260px;min-width:160px}
.search input{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 12px 0 34px;background:var(--surface);font-size:14px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.seg{display:inline-flex;background:#E4E8E4;border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 12px;font-size:13px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.h{font-size:16px;margin:0;font-weight:700}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.box h2{font-size:16px;margin:0 0 10px;font-weight:700}
.box-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.box-h h2{margin:0}
.help{font-size:12.5px;color:var(--muted);margin:4px 0 10px;line-height:1.6}
.none{padding:28px 16px;text-align:center;color:var(--muted);grid-column:1/-1}
.banner{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:9px 14px;border-radius:10px;margin-bottom:12px;font-size:14px;background:var(--gold-bg);color:#6B4E0E;border:1px solid #EFD9A0}
.banner.err{background:var(--minus-bg);color:#7A2A17;border-color:#EBC3B8}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--board2);box-shadow:0 0 0 3px rgba(44,86,75,.15)}

/* 录分 */
.score{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.card{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px 8px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"no pts" "nm pts";column-gap:6px;min-height:60px;transition:border-color .12s,background .12s}
.card:hover{border-color:#A9B5AE}
.card .no{grid-area:no;font-size:12px;color:var(--muted);font-family:var(--num)}
.card .nm{grid-area:nm;font-size:16.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.card .pts{grid-area:pts;align-self:center;display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.card .pts b{font-family:var(--num);font-size:21px;font-weight:600}
.card .pts small{font-size:11px;color:var(--muted);white-space:nowrap}
.card.sel{border-color:var(--board);background:var(--board-tint);box-shadow:inset 0 0 0 1px var(--board)}
.card.sel::after{content:"✓";position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--board);color:#fff;font-size:12px;display:grid;place-items:center;line-height:1}
.card .float{position:absolute;right:8px;top:-12px;font-family:var(--num);font-weight:700;font-size:18px;pointer-events:none;animation:rise 1.4s ease-out forwards}
.card.fp{animation:cfp 1.3s ease-out}
.card.fm{animation:cfm 1.3s ease-out}
.card.fp .float{color:var(--plus)}
.card.fm .float{color:var(--minus)}
@keyframes cfp{0%{background:var(--plus-bg);border-color:var(--plus)}}
@keyframes cfm{0%{background:var(--minus-bg);border-color:var(--minus)}}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.empty-state{grid-column:1/-1;background:var(--surface);border:1px dashed #C3CBC6;border-radius:14px;padding:40px 24px;text-align:center}
.empty-state h2{font-family:var(--kai);font-size:28px;font-weight:400;margin:0 0 6px}
.empty-state p{margin:6px 0;color:var(--ink2)}
.empty-state .row{display:flex;gap:8px;justify-content:center;margin:18px 0 12px}

.panel{position:sticky;top:74px;background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:calc(100vh - 90px);display:flex;flex-direction:column;overflow:hidden}
.panel-head{padding:14px 16px;border-bottom:1px solid var(--line2);min-height:76px;display:flex;flex-direction:column;justify-content:center}
.ph-tip b{display:block;font-size:15px}
.ph-tip span{font-size:12.5px;color:var(--muted)}
.ph-one{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph-name{font-size:18px;font-weight:700}
.ph-name small{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px;font-family:var(--num)}
.ph-stats{display:flex;gap:12px;font-size:12.5px;color:var(--muted)}
.ph-stats b{font-family:var(--num);font-size:15px;color:var(--ink);font-weight:600}
.ph-names{font-size:13px;color:var(--ink2);margin-top:2px}
.panel-body{overflow:auto;padding:4px 16px 16px}
.cat{font-size:12.5px;color:var(--muted);margin:12px 0 6px}
.items{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-flow:row dense;gap:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);text-align:left;font-size:13px;min-height:36px;line-height:1.3}
.item span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.wide{grid-column:1/-1}
.item b{font-family:var(--num);font-size:15px;flex:none}
.item.plus b{color:var(--plus)}
.item.minus b{color:var(--minus)}
.item.plus:hover:not(:disabled){background:var(--plus-bg);border-color:#A9D6BF}
.item.minus:hover:not(:disabled){background:var(--minus-bg);border-color:#E8B6A8}
.item:disabled{opacity:.5;cursor:not-allowed}
.custom{display:grid;grid-template-columns:76px 1fr auto;gap:6px}
.custom input{height:30px;border:1px solid var(--line);border-radius:7px;padding:0 8px;min-width:0;font-size:13px}
.panel .link{margin-top:14px;padding-left:0}

/* 表格 */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:#F7F8F6;text-align:left;font-weight:600;color:var(--ink2);font-size:13px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#FAFBF9}
.tbl .r{text-align:right}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--ink)}
.tbl th.on{color:var(--board)}
.tbl td.t{white-space:nowrap;color:var(--muted);font-family:var(--num)}
.tbl td.acts{white-space:nowrap}
.tbl .note-cell{color:var(--muted);font-size:13px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl small{color:var(--muted);font-size:11px;margin-left:2px}
.tbl tr.rv td{color:var(--muted)}
.tbl tr.rv td.strike{text-decoration:line-through;text-decoration-color:rgba(0,0,0,.3)}
.empty-row{text-align:center;color:var(--muted);padding:28px!important}
.tag{display:inline-block;font-size:12px;padding:0 7px;border-radius:999px;background:#EEF1EE;color:var(--ink2);margin-right:6px}
.note{color:var(--muted);font-size:12.5px;margin-left:6px}
.foot-note{color:var(--muted);font-size:13px;margin:10px 2px}
.more{display:flex;justify-content:center;margin-top:12px}
.status{font-size:12.5px;padding:1px 8px;border-radius:999px;white-space:nowrap}
.status.wait{background:var(--gold-bg);color:#8A6410}
.status.done{background:var(--plus-bg);color:var(--plus)}

/* 商城 */
.rewards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.rw{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.rw-top{display:flex;justify-content:space-between;align-items:center}
.kind{font-size:12px;padding:1px 8px;border-radius:999px}
.k-real{background:var(--gold-bg);color:#8A6410}
.k-virt{background:var(--board-tint);color:var(--board2)}
.rw-name{font-size:16px;font-weight:600;line-height:1.35}
.rw-desc{font-size:12.5px;color:var(--muted)}
.rw-cost{font-size:13px;color:var(--muted);margin-top:auto}
.rw-cost b{font-family:var(--num);font-size:26px;color:var(--ink);font-weight:600;margin-right:3px}
.rw-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.rw.out .rw-name,.rw.out .rw-cost{opacity:.55}
.rd-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.rd-head b{font-size:22px}
.rd-list{margin-top:10px;border:1px solid var(--line2);border-radius:10px;max-height:340px;overflow:auto}
.rd-row{display:grid;grid-template-columns:40px 1fr auto auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:0;border-bottom:1px solid var(--line2);padding:8px 12px;font-size:14px}
.rd-row:last-child{border-bottom:0}
.rd-row:hover:not(:disabled){background:#F6F8F6}
.rd-row.sel{background:var(--board-tint);box-shadow:inset 3px 0 0 var(--board)}
.rd-row:disabled{cursor:not-allowed;color:var(--muted)}
.rd-row .no{font-family:var(--num);color:var(--muted);font-size:12px}
.rd-row .nm{font-weight:600}
.rd-row:disabled .nm{font-weight:400}
.rd-row .av{font-size:13px;color:var(--muted)}
.rd-row .av b{font-family:var(--num);color:var(--ink);font-size:15px}
.rd-row .lack{font-size:12px;color:var(--minus)}
.rd-sum{margin-right:auto;font-size:14px;color:var(--ink2)}

/* 出勤 */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin:4px 0 12px}
.chip{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px;text-align:left;white-space:nowrap;overflow:hidden}
.chip small{font-family:var(--num);color:var(--muted);font-size:11px}
.chip em{font-style:normal;font-size:11px;color:var(--minus);margin-left:auto}
.chip.sel{border-color:var(--board);background:var(--board-tint);box-shadow:inset 0 0 0 1px var(--board)}
.att-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line2)}
.att-bar input{flex:1;min-width:160px;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px}
.fld{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.fld input,.box-h input[type=month]{height:34px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--surface)}

/* 设置 */
.settings{max-width:920px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink2)}
.form label.full{grid-column:1/-1}
.form input,.form select{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface);font-size:14px;color:var(--ink)}
.form .help{margin:2px 0 0}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;line-height:1.6;font-size:14px;font-family:var(--num),var(--font)}
.err{color:var(--minus);font-size:13px;min-height:1.2em;margin:0;grid-column:1/-1}
.items-tbl td{padding:4px 8px}
.items-tbl input{width:100%;height:32px;border:1px solid transparent;border-radius:6px;padding:0 8px;background:transparent;font-size:14px}
.items-tbl input:hover{border-color:var(--line)}
.items-tbl input.dval{width:84px;text-align:right;font-family:var(--num);font-weight:600;font-size:15px}
.items-tbl input.dval.pos{color:var(--plus)}
.items-tbl input.dval.neg{color:var(--minus)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tagx{display:inline-flex;gap:2px;align-items:center;padding:3px 4px 3px 12px;border:1px solid var(--line);border-radius:999px;font-size:14px}
.tagx button{border:0;background:none;color:var(--muted);width:22px;height:22px;border-radius:50%;line-height:1}
.tagx button:hover{background:var(--minus-bg);color:var(--minus)}
.inline-add{display:flex;gap:8px;max-width:420px}
.inline-add input{flex:1;height:30px;border:1px solid var(--line);border-radius:8px;padding:0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dz-row{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line2)}
.dz-row:first-of-type{border-top:0;padding-top:0}
.dz-row p{margin:2px 0 0;font-size:13px;color:var(--muted)}

/* 弹窗与提示 */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(18,28,24,.45);z-index:90;display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);color:var(--ink);font-family:var(--font);border-radius:14px;width:min(540px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.modal.wide{width:min(780px,100%)}
.modal-h{padding:14px 18px 14px 20px;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-h h3{margin:0;font-size:17px}
.modal-h .x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);width:32px;height:32px;border-radius:8px}
.modal-h .x:hover{background:#F0F2F0}
.modal-b{padding:16px 20px;overflow:auto}
.modal-f{padding:12px 20px;border-top:1px solid var(--line2);display:flex;align-items:center;justify-content:flex-end;gap:8px}
.ask{margin:0;font-size:15px;line-height:1.7}
.pin{width:100%;height:46px;font-size:24px;letter-spacing:.3em;text-align:center;border:1px solid var(--line);border-radius:10px;font-family:var(--num)}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;background:#1F2E29;color:#fff;border-radius:10px;padding:10px 14px 10px 16px;display:flex;gap:16px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.2);font-size:14px;max-width:min(640px,92vw)}
.toast button{background:none;border:0;color:var(--chalk-y);font-weight:600;padding:0;white-space:nowrap}
.sd-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.sd-stat{background:#F5F7F5;border-radius:10px;padding:10px 12px}
.sd-stat span{font-size:12px;color:var(--muted)}
.sd-stat b{display:block;font-family:var(--num);font-size:24px;font-weight:600;line-height:1.2}
.sd-h{font-size:14px;font-weight:700;margin:16px 0 6px;display:flex;justify-content:space-between;gap:12px}
.sd-h .muted{font-weight:400;font-size:13px}
.sd-list{border:1px solid var(--line2);border-radius:10px;max-height:280px;overflow:auto}
.sd-row{display:grid;grid-template-columns:92px minmax(0,1fr) auto 44px;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line2);font-size:13.5px}
.sd-row:last-child{border-bottom:0}
.sd-row.rv>span:nth-child(2),.sd-row.rv>b{text-decoration:line-through;color:var(--muted)}
.imp-prev{margin-top:12px}
.imp-prev .tbl-wrap{max-height:260px}
.imp-prev .tbl td,.imp-prev .tbl th{padding:5px 10px;font-size:13px}

/* ================= 大屏 ================= */
#display{position:fixed;top:0;left:0;right:0;bottom:0;z-index:80;color:var(--chalk);overflow:hidden;
  background:
    radial-gradient(70vw 50vh at 16% 10%,rgba(255,255,255,.06),transparent 70%),
    radial-gradient(60vw 45vh at 84% 92%,rgba(255,255,255,.045),transparent 70%),
    radial-gradient(40vw 30vh at 58% 46%,rgba(255,255,255,.025),transparent 70%),
    repeating-linear-gradient(97deg,rgba(255,255,255,.012) 0 2px,transparent 2px 11px),
    #1D3B32}

<body>
<header class="top" id="top"></header>
<main class="page" id="view"></main>
<div id="display" hidden></div>
<div id="modal-root"></div>
<div class="toasts" id="toast-root"></div>
<noscript><p style="padding:20px">这个页面需要开启 JavaScript 才能使用。</p></noscript>
<script>
(function(){
'use strict';

/* ---------- 基础工具 ---------- */
var KEY='class-points-v1';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var _u=0;
function uid(){return Date.now().toString(36)+(_u++).toString(36)+Math.random().toString(36).slice(2,6)}
function pad(n){return String(n).padStart(2,'0')}
var MINUS='−';
function fmtD(d){return d>0?'+'+d:d<0?MINUS+Math.abs(d):'0'}
function fmtN(n){return n<0?MINUS+Math.abs(n):String(n)}
function dayStr(t){var d=t==null?new Date():new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function weekStart(){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d.getTime()}
function fmtTime(t){var d=new Date(t);return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function fmtFull(t){var d=new Date(t);return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+pad(d.getHours())+':'+pad(d.getMinutes())}
var WEEK='日一二三四五六';
function md(ds){var p=ds.split('-');return Number(p[1])+'月'+Number(p[2])+'日'}
function safeName(s){return String(s).replace(/[\\\/:*?"<>|]/g,'_')}

var IC={
  search:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5L17 17"/></svg>',
  screen:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="2" y="3" width="16" height="11" rx="1.5"/><path d="M7 17h6M10 14v3"/></svg>',
  win:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="11" height="11" rx="1.5"/><path d="M7 3.5h9.5V13"/></svg>'
};

/* ---------- 默认配置 ---------- */
var DEFAULT_ITEMS=[
  ['体育','体育课出勤',1],['体育','体育课表现突出',2],['体育','体测达标',3],['体育','体育课无故缺勤',-2],
  ['纪律','课堂表现积极',2],['纪律','主动帮助同学',2],['纪律','课堂违纪',-2],['纪律','课间追逐打闹',-2],['纪律','未穿校服',-1],
  ['学习','作业全对',2],['学习','考试进步明显',5],['学习','作业未交',-2],
  ['劳动','值日认真负责',1],['劳动','值日缺席',-2],
  ['活动','为班级争得荣誉',5],['活动','积极参加班级活动',2]
];
var DEFAULT_REWARDS=[
  {name:'免作业卡（一次）',cost:30,kind:'虚拟',stock:null,desc:''},
  {name:'自选座位一周',cost:50,kind:'虚拟',stock:null,desc:''},
  {name:'当一天值日班长',cost:40,kind:'虚拟',stock:null,desc:''},
  {name:'课间点播一首歌',cost:15,kind:'虚拟',stock:null,desc:''},
  {name:'小零食一份',cost:10,kind:'实物',stock:20,desc:''},
  {name:'精美笔记本',cost:20,kind:'实物',stock:10,desc:''},
  {name:'文具礼包',cost:35,kind:'实物',stock:8,desc:''},
  {name:'课外书一本',cost:60,kind:'实物',stock:5,desc:''}
];
var DEFAULT_ATT=['迟到','早退','病假','事假','旷课'];

function fresh(){
  return {v:1,className:'我的班级',pin:'',students:[],
    items:DEFAULT_ITEMS.map(function(a){return {id:uid(),cat:a[0],name:a[1],d:a[2]}}),
    rewards:DEFAULT_REWARDS.map(function(r){var o={id:uid()};for(var k in r)o[k]=r[k];return o}),
    logs:[],att:[],attTypes:DEFAULT_ATT.slice(),lastBackup:0,sample:false};
}

/* ---------- 存储 ---------- */
var LS=null;
try{LS=window.localStorage;LS.setItem('__t','1');LS.removeItem('__t')}catch(e){LS=null}
/* 备份文件可能被人改过。读进来时把每个字段收成该有的类型、id 只许字母数字，
   渲染时数字和 id 才能直接拼进 HTML（页面和 /admin 同源，脚本注入能读到它的 token）。 */
var ID_RE=/^[\w-]{1,64}$/,DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
function toStr(v){return v==null?'':String(v)}
function toInt(v){v=Math.round(Number(v));return isFinite(v)?v:0}
function isId(v){return typeof v==='string'&&ID_RE.test(v)}
function recs(a){return Array.isArray(a)?a.filter(function(o){return o&&typeof o==='object'&&isId(o.id)}):[]}
function normalize(d){
  var f=fresh();
  var o={v:1,className:toStr(d.className)||f.className,pin:toStr(d.pin),lastBackup:toInt(d.lastBackup),sample:!!d.sample,
    students:recs(d.students).map(function(s){return {id:s.id,no:toStr(s.no),name:toStr(s.name),gender:s.gender==='男'||s.gender==='女'?s.gender:'',note:toStr(s.note)}}),
    items:Array.isArray(d.items)?recs(d.items).map(function(it){return {id:it.id,cat:toStr(it.cat),name:toStr(it.name),d:toInt(it.d)}}):f.items,
    rewards:Array.isArray(d.rewards)?recs(d.rewards).map(function(r){return {id:r.id,name:toStr(r.name),cost:Math.max(1,toInt(r.cost)),kind:r.kind==='实物'?'实物':'虚拟',stock:r.stock==null||r.stock===''?null:Math.max(0,toInt(r.stock)),desc:toStr(r.desc)}}):f.rewards,
    logs:recs(d.logs).map(function(l){
      var x={id:l.id,ts:toInt(l.ts),sids:Array.isArray(l.sids)?l.sids.filter(isId):[],d:toInt(l.d),label:toStr(l.label),cat:toStr(l.cat),note:toStr(l.note),kind:l.kind==='r'?'r':'s'};
      if(x.kind==='r'){x.rid=isId(l.rid)?l.rid:'';x.dlv=!!l.dlv}
      if(l.rv)x.rv=toInt(l.rv)||1;
      return x;
    }).filter(function(l){return l.sids.length}),
    att:recs(d.att).filter(function(a){return isId(a.sid)&&DATE_RE.test(a.date)}).map(function(a){return {id:a.id,sid:a.sid,date:a.date,type:toStr(a.type),note:toStr(a.note),ts:toInt(a.ts)}}),
    attTypes:Array.isArray(d.attTypes)?d.attTypes.map(toStr).filter(Boolean):f.attTypes};
  if(d.sampleName)o.sampleName=true;
  return o;
}
function load(){
  if(LS){try{var s=LS.getItem(KEY);if(s)return normalize(JSON.parse(s))}catch(e){console.error(e)}}
  return fresh();
}
var D=load();
function save(){
  if(!LS)return;
  try{LS.setItem(KEY,JSON.stringify(D))}
  catch(e){notice('保存失败','浏览器的存储空间可能已经满了。请到「设置」里先导出备份，再用「新学期归档」清理旧记录。')}
}

/* ---------- 统计 ---------- */
var S=null;
function calc(){
  var m=new Map(),ws=weekStart(),mk=dayStr().slice(0,7);
  D.students.forEach(function(s){m.set(s.id,{earned:0,spent:0,avail:0,week:0,att:0})});
  D.logs.forEach(function(l){
    if(l.rv)return;
    l.sids.forEach(function(id){
      var t=m.get(id);if(!t)return;
      if(l.kind==='r')t.spent-=l.d;
      else{t.earned+=l.d;if(l.ts>=ws)t.week+=l.d}
    });
  });
  D.att.forEach(function(a){var t=m.get(a.sid);if(t&&a.date.slice(0,7)===mk)t.att++});
  m.forEach(function(t){t.avail=t.earned-t.spent});
  return m;
}
function st(){return S||(S=calc())}
function commit(){S=null;save()}
function stu(id){for(var i=0;i<D.students.length;i++)if(D.students[i].id===id)return D.students[i];return null}
function byNo(a,b){return String(a.no).localeCompare(String(b.no),'zh',{numeric:true})||a.name.localeCompare(b.name,'zh')}
function students(){return D.students.slice().sort(byNo)}

/* ---------- 拼音首字母搜索 ---------- */
var PY_B='阿八嚓哒妸发旮哈讥咔垃痳拏噢妑七呥扨它穵夕丫帀',PY_L='abcdefghjklmnopqrstwxyz';
var pyColl=null;
try{var c0=new Intl.Collator('zh-Hans-CN');if(c0.compare('啊','八')<0&&c0.compare('张','王')>0)pyColl=c0}catch(e){}
var pyCache=new Map();
function initials(str){
  if(!pyColl)return '';
  if(pyCache.has(str))return pyCache.get(str);
  var out='';
  for(var ch of str){
    if(/[a-zA-Z0-9]/.test(ch)){out+=ch.toLowerCase();continue}
    if(!/[一-鿿]/.test(ch))continue;
    for(var i=PY_B.length-1;i>=0;i--){if(pyColl.compare(ch,PY_B[i])>=0){out+=PY_L[i];break}}
  }
  pyCache.set(str,out);return out;
}
function match(s,q){
  q=String(q||'').trim().toLowerCase();
  if(!q)return true;
  return String(s.no).toLowerCase().indexOf(q)>=0||s.name.toLowerCase().indexOf(q)>=0||(/^[a-z]+$/.test(q)&&initials(s.name).indexOf(q)>=0);
}
function pick(q){
  var qq=String(q||'').trim();
  if(!qq)return null;
  var list=students().filter(function(s){return match(s,qq)});
  if(!list.length)return null;
  var ex=list.filter(function(s){var n=String(s.no);return n===qq||(/^\d+$/.test(qq)&&/^\d+$/.test(n)&&Number(n)===Number(qq))||s.name===qq})[0];
  return ex||list[0];
}

/* ---------- 界面状态 ---------- */
var ui={tab:'score',q:'',sel:new Set(),sort:'no',flash:null,
  stuQ:'',stuSort:'no',stuDir:1,
  recQ:'',recType:'all',recRv:false,recLimit:100,
  attDate:dayStr(),attSel:new Set(),attQ:'',attMonth:dayStr().slice(0,7),
  shopTab:'pending',display:false,dview:'all',dflash:null};
var TABS=[['score','录分'],['students','学生'],['records','记录'],['shop','积分商城'],['att','出勤'],['settings','设置']];

function pruneSel(){
  [ui.sel,ui.attSel].forEach(function(set){set.forEach(function(id){if(!stu(id))set.delete(id)})});
}

function render(){
  S=null;pruneSel();renderTop();
  $('#view').innerHTML=VIEW[ui.tab]();
  if(AFTER[ui.tab])AFTER[ui.tab]();
}
function renderTop(){
  $('#top').innerHTML='<div class="brand"><span class="cls">'+esc(D.className)+'</span><span class="sub">积分管理</span></div>'+
    '<nav class="tabs">'+TABS.map(function(t){return '<button class="tab'+(ui.tab===t[0]?' on':'')+'" data-a="go" data-v="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</nav>'+
    '<span class="grow"></span>'+
    '<button class="btn-win" data-a="dWin" title="在新窗口打开大屏（适合接了投影、可以把窗口拖到第二块屏幕上）" aria-label="在新窗口打开大屏">'+IC.win+'</button>'+
    '<button class="btn-show" data-a="dOpen">'+IC.screen+'大屏展示</button>';
}

function banners(){
  var h='';
  if(!LS)h+='<div class="banner err"><span>这个浏览器不允许保存数据（无痕 / 隐私窗口常见），关掉页面后记录会丢失。请用 Chrome、Edge 或 360 浏览器（极速模式）的普通窗口打开。</span></div>';
  if(D.sample)h+='<div class="banner"><span>现在是示例数据，可以随便点点看效果。准备好了就清空，换成你班上的学生。</span><button class="btn sm" data-a="clearSample">清空示例，开始使用</button></div>';
  else if(D.logs.length){
    var last=D.lastBackup||0,newest=0,oldest=Infinity;
    D.logs.forEach(function(l){if(l.ts>newest)newest=l.ts;if(l.ts<oldest)oldest=l.ts});
    if(newest>last){
      var days=Math.floor((Date.now()-(last||oldest))/86400000);
      if(days>=7)h+='<div class="banner"><span>'+(last?'已经 '+days+' 天没备份了。':'还没有备份过。')+'数据只存在这台电脑的浏览器里，建议每周导出一次。</span><button class="btn sm" data-a="backup">立即备份</button></div>';
    }
  }
  return h;
}

/* ================= 录分 ================= */
var VIEW={},AFTER={};
VIEW.score=function(){
  return banners()+'<div class="score"><section>'+
    '<div class="toolbar">'+
      '<label class="search">'+IC.search+'<input id="q" type="search" placeholder="搜学号、姓名或拼音首字母，回车选中" value="'+esc(ui.q)+'" autocomplete="off"></label>'+
      '<div class="seg"><button class="'+(ui.sort==='no'?'on':'')+'" data-a="sort" data-v="no">按学号</button><button class="'+(ui.sort==='pts'?'on':'')+'" data-a="sort" data-v="pts">按积分</button></div>'+
      '<span class="grow"></span>'+
      '<button class="btn" data-a="selAll">全选</button>'+
      '<button class="btn" data-a="selNone" id="selNone">清除选择</button>'+
    '</div><div id="grid" class="grid"></div></section>'+
    '<aside id="panel" class="panel"></aside></div>';
};
AFTER.score=function(){renderScoreParts()};
function renderScoreParts(){
  renderGrid();renderPanel();
  var b=$('#selNone');if(b)b.disabled=!ui.sel.size;
}
function renderGrid(){
  var g=$('#grid');if(!g)return;
  if(!D.students.length){
    g.innerHTML='<div class="empty-state"><h2>先把班里的学生加进来</h2><p>从 Excel 复制学号和姓名两列，一次粘贴就能导入全班。</p>'+

function revokeLog(id,sid){
  var l=null;for(var i=0;i<D.logs.length;i++)if(D.logs[i].id===id){l=D.logs[i];break}
  if(!l||l.rv)return;
  if(sid&&l.sids.length>1){
    l.sids=l.sids.filter(function(x){return x!==sid});
    var c={};for(var k in l)c[k]=l[k];
    c.id=uid();c.sids=[sid];c.rv=Date.now();D.logs.push(c);
  }else{
    l.rv=Date.now();
    if(l.kind==='r'){var r=findReward(l.rid);if(r&&r.stock!=null)r.stock++}
  }
  commit();
}

/* 批量导入 */
function parseRoster(text){
  var rows=[];
  text.split(/\r?\n/).forEach(function(line){
    line=line.trim();if(!line)return;
    var cells=line.split(/\t|,|，|;|；|\s+/).map(function(c){return c.trim()}).filter(Boolean);
    if(!cells.length)return;
    if(cells.some(function(c){return /^(学号|姓名|名字|序号|性别|编号)$/.test(c)}))return;
    var nums=cells.filter(function(c){return /\d/.test(c)&&/^[A-Za-z0-9-]+$/.test(c)});
    var no=nums.slice().sort(function(a,b){return b.length-a.length})[0]||'';
    var gender=cells.filter(function(c){return c==='男'||c==='女'})[0]||'';
    var name=cells.filter(function(c){return nums.indexOf(c)<0&&c!=='男'&&c!=='女'})[0]||'';
    if(name)rows.push({no:no,name:name,gender:gender});
  });
  var used=new Set(D.students.map(function(s){return s.no})),inBatch=new Set();
  var numsAll=D.students.map(function(s){return s.no}).concat(rows.map(function(r){return r.no})).filter(function(n){return /^\d+$/.test(n)});
  var next=numsAll.length?Math.max.apply(null,numsAll.map(Number))+1:1;
  var width=Math.max(2,numsAll.reduce(function(w,n){return Math.max(w,n.length)},0));
  rows.forEach(function(r){
    if(!r.no){r.no=String(next++).padStart(width,'0');r.auto=true}
    if(used.has(r.no))r.skip='学号已存在';
    else if(inBatch.has(r.no))r.skip='学号重复';
    inBatch.add(r.no);
  });
  return rows;
}

  var go=function(){

      body:'<p class="help" style="margin-top:0">在 Excel 里选中「学号、姓名」两列，复制后粘贴到下面。第三列可以放性别。只有姓名一列也行，学号会按顺序自动编。</p>'+

      foot:'<span class="rd-sum" id="impSum"></span><button class="btn" data-close>取消</button><button class="btn primary" data-ok disabled>导入</button>'});

      $('#impPrev',m.el).innerHTML=rows.length?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>学号</th><th>姓名</th><th>性别</th><th></th></tr></thead><tbody>'+

        '</tbody></table></div>':'';
    };
    $('#imp',m.el).addEventListener('input',draw);
    $('[data-ok]',m.el).onclick=function(){
      var ok=rows.filter(function(r){return !r.skip});

      commit();m.close();render();toast('已导入 '+ok.length+' 名学生');
    };

  };
  if(D.sample){
    ask('先清空示例数据？','现在页面里是示例学生。导入你班上的学生之前，建议先把示例清空。','清空示例并导入').then(function(ok){if(ok){doClearSample();go()}});
  }else go();
}

function editReward(id){
  var r=id?findReward(id):null;
  var body='<div class="form">'+
    '<label class="full">奖励名称<input id="r-name" value="'+esc(r?r.name:'')+'" maxlength="30" placeholder="比如：免作业卡、自选座位" autofocus></label>'+

    '<label>类型<select id="r-kind"><option'+(r&&r.kind==='实物'?' selected':'')+'>实物</option><option'+(!r||r.kind==='虚拟'?' selected':'')+'>虚拟</option></select></label>'+
    '<label>库存<input id="r-stock" type="number" min="0" step="1" value="'+(r&&r.stock!=null?r.stock:'')+'" placeholder="不填表示不限量"></label>'+
    '<label>说明（可选）<input id="r-desc" value="'+esc(r?r.desc||'':'')+'" maxlength="60"></label>'+
    '<p class="err" id="r-err"></p></div>';
  var m=modal({title:r?'编辑奖励':'添加奖励',body:body,foot:(r?'<button class="btn danger" data-del>下架</button><span class="grow"></span>':'')+'<button class="btn" data-close>取消</button><button class="btn primary" data-ok>保存</button>'});
  var doSave=function(){
    var name=$('#r-name',m.el).value.trim(),cost=parseInt($('#r-cost',m.el).value,10),sv=$('#r-stock',m.el).value.trim(),err=$('#r-err',m.el);
    if(!name){err.textContent='请填写奖励名称';return}
    if(!(cost>0)){err.textContent='所需积分要大于 0';return}
    var stock=sv===''?null:parseInt(sv,10);
    if(stock!=null&&!(stock>=0)){err.textContent='库存要填 0 或正整数';return}
    var o=r||{id:uid()};
    o.name=name;o.cost=cost;o.kind=$('#r-kind',m.el).value;o.stock=stock;o.desc=$('#r-desc',m.el).value.trim();
    if(!r)D.rewards.push(o);
    commit();m.close();render();toast(r?'已保存':'已上架「'+name+'」');
  };
  $('[data-ok]',m.el).onclick=doSave;
  m.el.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.tagName==='INPUT')doSave()});
  if(r)$('[data-del]',m.el).onclick=function(){
    m.close();
    ask('下架奖励','确定下架「'+esc(r.name)+'」吗？已经兑换的记录会保留。','下架',true).then(function(ok){
      if(!ok)return;D.rewards=D.rewards.filter(function(x){return x.id!==r.id});commit();render();toast('已下架');
    });

function openRedeem(rid){
  var r=findReward(rid);if(!r)return;
  var q='',chosen=null;
  var m=modal({title:'兑换「'+r.name+'」',
    body:'<div class="rd-head"><span>需要 <b class="num">'+r.cost+'</b> 积分</span><span class="muted">'+(r.stock==null?'不限量':'剩 '+r.stock+' 件')+'</span></div>'+
      '<label class="search" style="max-width:none">'+IC.search+'<input id="rdq" type="search" placeholder="搜学号、姓名或拼音首字母" autocomplete="off" autofocus></label><div class="rd-list" id="rdl"></div>',
    foot:'<span class="rd-sum" id="rds"></span><button class="btn" data-close>取消</button><button class="btn primary" data-ok disabled>确认兑换</button>'});
  var draw=function(){
    var s=st();
    var list=students().filter(function(x){return match(x,q)}).sort(function(a,b){return s.get(b.id).avail-s.get(a.id).avail||byNo(a,b)});
    $('#rdl',m.el).innerHTML=list.length?list.map(function(x){
      var av=s.get(x.id).avail,ok=av>=r.cost;
      return '<button class="rd-row'+(chosen===x.id?' sel':'')+'" data-sid="'+x.id+'"'+(ok?'':' disabled')+'><span class="no">'+esc(x.no)+'</span><span class="nm">'+esc(x.name)+'</span>'+
        (ok?'<span></span>':'<span class="lack">还差 '+(r.cost-av)+'</span>')+'<span class="av">可用 <b>'+fmtN(av)+'</b></span></button>';
    }).join(''):'<div class="none">没有找到</div>';
    var btn=$('[data-ok]',m.el);
    if(chosen){var x=stu(chosen),av=s.get(chosen).avail;$('#rds',m.el).textContent=x.name+'：可用 '+av+' → '+(av-r.cost);btn.disabled=false}
    else{$('#rds',m.el).textContent='点选一位学生';btn.disabled=true}
  };
  draw();
  $('#rdq',m.el).addEventListener('input',function(e){q=e.target.value;draw()});
  $('#rdq',m.el).addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;
    var p=pick(q);if(p&&st().get(p.id).avail>=r.cost){chosen=p.id;draw()}
  });
  $('#rdl',m.el).addEventListener('click',function(e){var b=e.target.closest('.rd-row');if(!b||b.disabled)return;chosen=b.dataset.sid;draw()});
  $('[data-ok]',m.el).onclick=function(){if(chosen){doRedeem(r.id,chosen);m.close()}};
}
function doRedeem(rid,sid){
  var r=findReward(rid),t=st().get(sid),x=stu(sid);
  if(!r||!t||!x||t.avail<r.cost)return;
  if(r.stock!=null&&r.stock<=0)return;
  D.logs.push({id:uid(),ts:Date.now(),sids:[sid],d:-r.cost,label:r.name,cat:'兑换',note:'',kind:'r',rid:r.id,dlv:false});
  if(r.stock!=null)r.stock--;
  commit();render();toast(x.name+' 兑换了「'+r.name+'」，花掉 '+r.cost+' 积分');
}

/* ---------- 导入导出 ---------- */
function csv(rows){return '﻿'+rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);return /[",\r\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')}).join('\r\n')}
function noCell(no){return /^0\d*$/.test(String(no))?'="'+no+'"':no}
function download(name,content,type){
  var blob=content instanceof Blob?content:new Blob([content],{type:type||'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
}
function exportBackup(silent){
  D.lastBackup=Date.now();commit();
  var d=new Date();
  download(safeName(D.className)+'-积分备份-'+dayStr()+'-'+pad(d.getHours())+pad(d.getMinutes())+'.json',JSON.stringify(D),'application/json');
  if(!silent){render();toast('备份文件已导出，请放到 U 盘或网盘里保存好')}
}

function loadSample(){
  var names='王子涵 李欣怡 张浩然 刘雨桐 陈思远 杨梓萱 赵一鸣 黄诗琪 周俊杰 吴可欣 徐子轩 孙雨萱 马天宇 朱梦瑶 胡宇航 郭佳怡 何嘉豪 高欣妍 林子墨 罗雅琪 郑博文 梁晓萌 谢明轩 宋语嫣 唐浩宇 许诗涵 韩睿哲 冯梓涵 邓俊熙 曹若曦 彭宇轩 曾雨菲 肖奕辰 田心怡 董泽宇 袁佳琪 潘一诺 于子豪 蒋舒涵 蔡文博 余雨欣 杜昊然'.split(' ');
  var R=mulberry(1031),pickR=function(a){return a[Math.floor(R()*a.length)]};
  if(!D.items.length)D.items=fresh().items;
  if(!D.attTypes.length)D.attTypes=DEFAULT_ATT.slice();
  D.students=names.map(function(n,i){return {id:uid(),no:pad(i+1),name:n,gender:(i%2===1||i===36)?'女':'男',note:''}});
  var ss=D.students,prop=ss.map(function(){return 0.3+R()*1.4});
  var wpick=function(w){var sum=w.reduce(function(a,b){return a+b},0),x=R()*sum;for(var i=0;i<w.length;i++){x-=w[i];if(x<=0)return i}return w.length-1};
  var pe=D.items.filter(function(i){return i.name==='体育课出勤'})[0],peAbs=D.items.filter(function(i){return i.name==='体育课无故缺勤'})[0];
  var pos=D.items.filter(function(i){return i.d>0&&i!==pe}),neg=D.items.filter(function(i){return i.d<0&&i!==peAbs});
  var logs=[],nowT=Date.now(),day=new Date();day.setHours(0,0,0,0);day.setDate(day.getDate()-34);
  var mk=function(ts,sids,it){return {id:uid(),ts:ts,sids:sids,d:it.d,label:it.name,cat:it.cat,note:'',kind:'s'}};
  for(var k=0;k<=34;k++){
    var wd=day.getDay(),base=day.getTime();day.setDate(day.getDate()+1);
    if(wd===0||wd===6)continue;
    var at=function(h,m){return base+h*3600000+m*60000};
    if(pe&&(wd===2||wd===4)){
      var t0=at(10,15+Math.floor(R()*20));
      if(t0<nowT){
        var abs=ss.filter(function(){return R()<0.05});
        logs.push(mk(t0,ss.filter(function(s){return abs.indexOf(s)<0}).map(function(s){return s.id}),pe));
        if(peAbs)abs.forEach(function(s){if(R()<0.4)logs.push(mk(t0+60000,[s.id],peAbs))});
      }
    }
    var n=6+Math.floor(R()*8);
    for(var j=0;j<n;j++){
      var t1=at(8+Math.floor(R()*9),Math.floor(R()*60));if(t1>=nowT)continue;
      var good=R()<0.78,list=good?pos:neg;if(!list.length)continue;
      var it=pickR(list),idx=wpick(good?prop:prop.map(function(p){return 1.8-p}));
      logs.push(mk(t1,[ss[idx].id],it));
    }
  }
  logs.sort(function(a,b){return a.ts-b.ts});
  D.logs=logs;S=null;
  var s=calc(),cnt=0;
  ss.slice().sort(function(a,b){return s.get(b.id).avail-s.get(a.id).avail}).slice(0,16).forEach(function(x){
    if(cnt>=7||R()<0.3)return;
    var av=s.get(x.id).avail,aff=D.rewards.filter(function(r){return r.cost<=av&&(r.stock==null||r.stock>0)});
    if(!aff.length)return;
    var r=pickR(aff);
    var rd=new Date(nowT-86400000*(1+Math.floor(R()*8)));if(rd.getDay()===0)rd.setDate(rd.getDate()-2);if(rd.getDay()===6)rd.setDate(rd.getDate()-1);rd.setHours(12+Math.floor(R()*5),Math.floor(R()*60),0,0);
    D.logs.push({id:uid(),ts:rd.getTime(),sids:[x.id],d:-r.cost,label:r.name,cat:'兑换',note:'',kind:'r',rid:r.id,dlv:R()<0.5});
    if(r.stock!=null)r.stock--;
    s.get(x.id).avail-=r.cost;cnt++;
  });
  var tw=D.attTypes.map(function(t){return {'迟到':10,'早退':1.5,'病假':3,'事假':3,'旷课':0.6}[t]||1});
  D.att=[];
  for(var a=0;a<22;a++){
    var dd=new Date();dd.setDate(dd.getDate()-Math.floor(R()*30));
    if(dd.getDay()===0||dd.getDay()===6)continue;
    var x=ss[wpick(prop.map(function(p){return 1.8-p}))],type=D.attTypes[wpick(tw)],ds=dayStr(dd.getTime());
    if(D.att.some(function(o){return o.sid===x.id&&o.date===ds&&o.type===type}))continue;
    dd.setHours(7,40+Math.floor(R()*15),0,0);
    D.att.push({id:uid(),sid:x.id,date:ds,type:type,note:type==='迟到'?pickR(['','','迟到 5 分钟','迟到 10 分钟']):'',ts:dd.getTime()});
  }
  D.sample=true;
  if(D.className==='我的班级'){D.className='初二（3）班';D.sampleName=true}
  ui.sel.clear();ui.attSel.clear();ui.tab='score';
  commit();render();toast('已载入 42 名示例学生和最近一个月的记录');
}
function doClearSample(){
  D.logs.forEach(function(l){if(l.kind==='r'&&!l.rv){var r=findReward(l.rid);if(r&&r.stock!=null)r.stock++}});
  D.students=[];D.logs=[];D.att=[];D.sample=false;
  if(D.sampleName){if(D.className==='初二（3）班')D.className='我的班级';delete D.sampleName}
  ui.sel.clear();ui.attSel.clear();
  commit();render();
}

/* ================= 大屏 ================= */
function clockStr(){var d=new Date();return (d.getMonth()+1)+'月'+d.getDate()+'日　星期'+WEEK[d.getDay()]+'　'+pad(d.getHours())+':'+pad(d.getMinutes())}
var RANK_CN=['','第一名','第二名','第三名'];
function ranked(key){
  var s=st();
  var list=students().map(function(x){var t=s.get(x.id);return {x:x,v:t[key],t:t}});
  list.sort(function(a,b){return b.v-a.v||byNo(a.x,b.x)});
  var prev=null,r=0;
  list.forEach(function(o,i){if(o.v!==prev){r=i+1;prev=o.v}o.r=r});
  return list;
}
function renderDisplay(){
  var el=$('#display');S=null;
  var v=ui.dview,sub=v==='shop'?'积分商城':v==='week'?'本周积分榜':'积分总榜';
  var ctrlOn=$('.d-wrap',el)&&$('.d-wrap',el).classList.contains('ctrl');
  el.innerHTML='<div class="d-wrap'+(ctrlOn?' ctrl':'')+'" id="dwrap">'+
    '<header class="d-head"><span class="d-class chalk">'+esc(D.className)+'</span><span class="d-sub chalk">'+sub+'</span>'+
      '<nav class="d-tabs">'+[['all','总榜'],['week','本周'],['shop','商城']].map(function(t){return '<button class="d-tab'+(v===t[0]?' on':'')+'" data-a="dView" data-v="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</nav>'+
      '<div class="d-date" id="dclock">'+clockStr()+'</div></header>'+
    '<main class="d-main">'+(v==='shop'?dShop():dBoard(v==='week'?'week':'earned'))+'</main>'+

/* 奖励名一行放不下：先缩字号挤进一行（最多缩到七成，行高不变，卡片不跳），再不行就折行 */
function fitNames(){
  document.querySelectorAll('.d-item-name').forEach(function(el){
    var r=el.clientWidth/el.scrollWidth;if(r>=1)return;
    var fs=parseFloat(getComputedStyle(el).fontSize);
    if(r>=0.7){el.style.fontSize=(fs*r*0.98).toFixed(1)+'px';el.style.lineHeight=(fs*1.2).toFixed(1)+'px'}
    else{el.style.whiteSpace='normal';el.style.fontSize=(fs*0.8).toFixed(1)+'px'}
  });
}
/* 底栏「最近加分」放不下时做成走马灯：复制一份接在后面，滚到一半正好无缝衔接。
   系统设了「减少动态效果」就不滚，只留放得下的几条。 */
function fitFeed(){
  var box=$('.d-feed'),tr=box&&box.firstChild;
  if(!tr||tr.scrollWidth<=box.clientWidth)return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches){
    while(tr.children.length>1&&tr.scrollWidth>box.clientWidth)tr.lastChild.remove();
    return;
  }
  var w=tr.scrollWidth;
  tr.innerHTML+=tr.innerHTML;
  tr.style.setProperty('--dur',(w/box.clientWidth*40).toFixed(1)+'s');
  box.classList.add('run');
}
function dBoard(key){
  if(!D.students.length)return '<div class="d-empty chalk">还没有学生，先在管理页面导入名单</div>';
  var list=ranked(key),fl=ui.dflash,top=list.slice(0,3),rest=list.slice(3);
  var second=key==='week'?'earned':'avail',secondLbl=key==='week'?'累计 ':'可用 ';
  var flash=function(o){return fl&&fl.has(o.x.id)?fl.get(o.x.id):0};
  var pod=function(o,big){
    if(!o)return '<div class="pod sm" style="visibility:hidden"></div>';
    var f=flash(o);
    return '<div class="pod '+(big?'big':'sm')+(f?' fl':'')+'"><div class="pod-rk'+(o.r===1?' first':'')+'">'+RANK_CN[o.r]+'</div>'+
      '<div class="pod-nm chalk">'+esc(o.x.name)+'</div>'+
      '<div class="pod-sc"><b class="'+(o.v<0?'neg':'')+'">'+(key==='week'?fmtD(o.v):fmtN(o.v))+'</b><span>'+secondLbl+fmtN(o.t[second])+'</span></div>'+
      (f?'<span class="d-float'+(f<0?' m':'')+'" style="font-size:min(5vh,3vw);right:1vw;top:1vh">'+fmtD(f)+'</span>':'')+'</div>';
  };
  var cols=rest.length<=12?1:rest.length<=26?2:rest.length<=42?3:4;
  var rows=Math.max(1,Math.ceil(rest.length/cols));
  var colW=(0.68*94-(cols-1)*2.4)/cols;
  var fs='min('+Math.min(3.4,64/Math.max(rows,8)*0.5).toFixed(2)+'vh,'+(colW/9.5).toFixed(2)+'vw)';
  return '<div class="d-board"><div class="d-pod">'+pod(top[0],true)+'<div class="d-pair">'+pod(top[1])+pod(top[2])+'</div></div>'+
    '<div class="d-list" style="--fs:'+fs+';grid-template-rows:repeat('+rows+',minmax(0,1fr));grid-template-columns:repeat('+cols+',minmax(0,1fr))">'+
    rest.map(function(o){
      var f=flash(o);
      return '<div class="d-row'+(f?' fl':'')+'"><span class="rk">'+o.r+'</span><span class="nm chalk">'+esc(o.x.name)+'</span>'+
        '<span class="sc'+(o.v<0?' neg':'')+'">'+(key==='week'?fmtD(o.v):fmtN(o.v))+'<small>'+secondLbl+fmtN(o.t[second])+'</small></span>'+
        (f?'<span class="d-float'+(f<0?' m':'')+'">'+fmtD(f)+'</span>':'')+'</div>';
    }).join('')+'</div></div>';
}
function dShop(){
  var s=st(),avs=D.students.map(function(x){return s.get(x.id).avail});
  var list=D.rewards.slice().sort(function(a,b){return a.cost-b.cost});
  if(!list.length)return '<div class="d-empty chalk">商城还没有上架奖励</div>';
  return '<div class="d-shop">'+list.map(function(r){
    var n=avs.filter(function(v){return v>=r.cost}).length,out=r.stock!=null&&r.stock<=0;
    return '<div class="d-item'+(out?' out':'')+'"><div class="d-item-kind">'+esc(r.kind)+'</div><div class="d-item-name chalk">'+esc(r.name)+'</div>'+
      '<div class="d-item-cost"><b>'+r.cost+'</b>积分</div><div class="d-item-meta">'+(out?'已兑完':(n?n+' 位同学现在就能兑换':'还没有同学够分，加油')+(r.stock!=null?'，还剩 '+r.stock+' 件':''))+'</div></div>';
  }).join('')+'</div>';
}
function dFeed(){
  var list=D.logs.filter(function(l){return !l.rv&&l.kind!=='r'&&l.d>0}).sort(function(a,b){return b.ts-a.ts}).slice(0,10);
  if(!list.length)return '<span class="lbl">最近加分</span><span class="quiet">还没有加分记录，第一位会是谁？</span>';
  return '<span class="lbl">最近加分</span><div class="d-feed"><div class="d-track">'+list.map(function(l){return '<span class="d-pill">'+esc(whoText(l.sids,1))+'　'+esc(l.label)+'<b>+'+l.d+'</b></span>'}).join('')+'</div></div>';
}
var ctrlT=null,clockT=null;
function openDisplay(full){
  ui.display=true;ui.dflash=null;
  var el=$('#display');el.hidden=false;document.body.classList.add('in-display');$('#toast-root').innerHTML='';
  renderDisplay();showCtrl();
  // 地址带上 #display：学生按 F5 刷新还停在大屏，退出照样要密码
  if(location.hash!=='#display'){try{history.replaceState(null,'',location.href.split('#')[0]+'#display')}catch(e){}}
  if(full)goFull();
  var day=dayStr();
  clearInterval(clockT);clockT=setInterval(function(){
    // 大屏常开过夜：跨天重画一次，周一早上「本周」榜才会清零
    if(dayStr()!==day){day=dayStr();renderDisplay();return}
    var c=$('#dclock');if(c)c.textContent=clockStr();
  },15000);
}
function goFull(){
  try{var de=document.documentElement;if(!document.fullscreenElement&&de.requestFullscreen)de.requestFullscreen().catch(function(){})}catch(e){}
}
function toggleFull(){
  try{if(document.fullscreenElement)document.exitFullscreen().catch(function(){});else goFull()}catch(e){}
}
function exitDisplay(){
  if(D.pin){askPin().then(function(ok){if(ok)doExit()})}else doExit();
}
function doExit(){
  ui.display=false;clearInterval(clockT);
  $('#display').hidden=true;$('#display').innerHTML='';document.body.classList.remove('in-display');
  try{if(document.fullscreenElement)document.exitFullscreen().catch(function(){})}catch(e){}
  if(location.hash==='#display'){try{history.replaceState(null,'',location.href.split('#')[0])}catch(e){location.hash=''}}
  render();
}
function showCtrl(){
  var w=$('#dwrap');if(!w)return;
  w.classList.add('ctrl');clearTimeout(ctrlT);
  ctrlT=setTimeout(function(){var w2=$('#dwrap');if(w2)w2.classList.remove('ctrl')},2600);
}
function askPin(){
  return new Promise(function(res){
    var m=modal({title:'输入密码退出大屏',body:'<input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" autofocus><p class="err" id="pin-err" style="margin-top:8px"></p>',
      foot:'<button class="btn" data-close>取消</button><button class="btn primary" data-ok>确定</button>',onClose:function(){res(false)}});
    var go=function(){
      if($('#pin',m.el).value===D.pin){m.el.remove();res(true)}
      else{$('#pin-err',m.el).textContent='密码不对，再试一次';$('#pin',m.el).select()}
    };
    $('[data-ok]',m.el).onclick=go;
    $('#pin',m.el).addEventListener('keydown',function(e){if(e.key==='Enter')go()});
  });
}

/* ---------- 弹窗、提示 ---------- */
function modal(o){
  var ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML='<div class="modal'+(o.wide?' wide':'')+'" role="dialog" aria-modal="true" aria-label="'+esc(o.title)+'"><div class="modal-h"><h3>'+esc(o.title)+'</h3><button class="x" data-close aria-label="关闭">×</button></div>'+
    '<div class="modal-b">'+o.body+'</div>'+(o.foot?'<div class="modal-f">'+o.foot+'</div>':'')+'</div>';
  $('#modal-root').appendChild(ov);
  var closed=false;
  var close=function(){if(closed)return;closed=true;ov.remove();if(o.onClose)o.onClose()};
  ov.addEventListener('click',function(e){if(e.target.closest('[data-close]'))close()});
  ov._close=close;
  setTimeout(function(){var f=ov.querySelector('[autofocus]')||ov.querySelector('.modal-b input,.modal-b select,.modal-b textarea')||ov.querySelector('.modal-f .primary');if(f)f.focus()},30);
  return {el:ov,close:close};
}
function ask(title,msg,okText,danger){
  return new Promise(function(res){
    var m=modal({title:title,body:'<p class="ask">'+msg+'</p>',foot:'<button class="btn" data-close>取消</button><button class="btn '+(danger?'danger-fill':'primary')+'" data-ok>'+esc(okText||'确定')+'</button>',onClose:function(){res(false)}});
    $('[data-ok]',m.el).onclick=function(){m.el.remove();res(true)};
  });
}
function notice(title,msg){modal({title:title,body:'<p class="ask">'+esc(msg)+'</p>',foot:'<button class="btn primary" data-close>知道了</button>'})}
function toast(msg,undo){
  var root=$('#toast-root'),el=document.createElement('div');el.className='toast';
  el.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button>撤销</button>':'');
  root.appendChild(el);
  while(root.children.length>3)root.firstChild.remove();
  var t=setTimeout(function(){el.remove()},undo?7000:2800);
  if(undo)el.querySelector('button').onclick=function(){clearTimeout(t);el.remove();undo()};
}

  go:function(t){ui.tab=t.dataset.v;render();window.scrollTo(0,0)},

    ids.forEach(function(sid){
      if(D.att.some(function(a){return a.sid===sid&&a.date===ui.attDate&&a.type===type}))return;
      D.att.push({id:uid(),sid:sid,date:ui.attDate,type:type,note:note,ts:Date.now()});added++;
    });
    commit();ui.attSel.clear();if($('#attNote'))$('#attNote').value='';
    renderAttChips();renderAttBar();renderAttDay();renderAttMon();
    toast(added?'已记录：'+whoText(ids,2)+' '+type:'这些同学当天已经记过'+type+'了');
  },
  attDel:function(t){
    var i=-1;for(var k=0;k<D.att.length;k++)if(D.att[k].id===t.dataset.id){i=k;break}
    if(i<0)return;var rec=D.att.splice(i,1)[0];commit();
    renderAttChips();renderAttDay();renderAttMon();
    toast('已删除这条出勤记录',function(){D.att.push(rec);commit();renderAttChips();renderAttDay();renderAttMon()});
  },
  attExport:function(){
    var md0=attMonthData(),rows=[['学号','姓名'].concat(md0.types,['合计'])];
    md0.rows.forEach(function(o){rows.push([noCell(o.x.no),o.x.name].concat(md0.types.map(function(t){return o.r[t]||0}),[o.tot]))});
    rows.push([]);rows.push(['明细']);rows.push(['日期','学号','姓名','类型','备注']);
    D.att.filter(function(a){return a.date.slice(0,7)===ui.attMonth}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts}).forEach(function(a){var x=stu(a.sid);rows.push([a.date,x?noCell(x.no):'',x?x.name:'已删除',a.type,a.note])});
    download(safeName(D.className)+'-出勤-'+ui.attMonth+'.csv',csv(rows));
  },
  itemAdd:function(){
    var last=D.items.length?D.items[D.items.length-1].cat:'其他';
    var it={id:uid(),cat:last,name:'新项目',d:1};D.items.push(it);commit();render();
    var inp=document.querySelector('input[data-item="'+it.id+'"][data-f="name"]');if(inp){inp.focus();inp.select()}
  },
  itemDel:function(t){
    var i=-1;for(var k=0;k<D.items.length;k++)if(D.items[k].id===t.dataset.id){i=k;break}
    if(i<0)return;var it=D.items.splice(i,1)[0];commit();render();
    toast('已删除「'+it.name+'」',function(){D.items.splice(i,0,it);commit();render()});
  },
  attTypeDel:function(t){var i=Number(t.dataset.i),ty=D.attTypes[i];D.attTypes.splice(i,1);commit();render();toast('已删除「'+ty+'」，以前的记录还在',function(){D.attTypes.splice(i,0,ty);commit();render()})},
  attTypeAdd:function(){var v=$('#newAtt').value.trim();if(!v)return;if(D.attTypes.indexOf(v)>=0){toast('已经有「'+v+'」了');return}D.attTypes.push(v);commit();render()},
  backup:function(){exportBackup(false)},
  restore:function(){$('#restoreFile').click()},
  exportCsv:function(){
    var s=st(),rows=[['学号','姓名','性别','累计积分','可用积分','兑换花掉','本周','本月出勤异常','备注']];
    students().forEach(function(x){var t=s.get(x.id);rows.push([noCell(x.no),x.name,x.gender,t.earned,t.avail,t.spent,t.week,t.att,x.note])});
    download(safeName(D.className)+'-积分表-'+dayStr()+'.csv',csv(rows));
  },
  archive:function(){
    ask('新学期归档','会先自动下载一份完整备份，然后清空所有积分、兑换和出勤记录。学生名单、积分项目和商城会保留。确定吗？','备份并清空').then(function(ok){
      if(!ok)return;exportBackup(true);
      D.logs=[];D.att=[];D.sample=false;commit();render();toast('已归档，新学期从 0 分开始');
    });
  },
  wipe:function(){
    ask('清空全部数据','学生、记录、积分项目和商城都会被删除，不能恢复。建议先导出备份。','全部清空',true).then(function(ok){
      if(!ok)return;D=fresh();ui.sel.clear();ui.attSel.clear();commit();ui.tab='score';render();toast('已清空');
    });
  },
  sample:function(){loadSample()},
  clearSample:function(){ask('清空示例数据','会删除示例学生和他们的所有记录，积分项目和商城设置保留。','清空').then(function(ok){if(ok){doClearSample();toast('示例已清空，现在可以导入你班上的学生了')}})},
  dOpen:function(){openDisplay(true)},
  dWin:function(){
    var w=window.open(location.href.split('#')[0]+'#display','class-points-display');
    if(!w)toast('浏览器拦截了新窗口，请在地址栏右侧允许弹出窗口');
  },
  dExit:function(){exitDisplay()},
  dFull:function(){toggleFull()},
  dView:function(t){ui.dview=t.dataset.v;ui.dflash=null;renderDisplay()}
};

/* ---------- 全局事件 ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t||t.disabled)return;
  var f=A[t.dataset.a];if(f){e.preventDefault();f(t,e)}
});
document.addEventListener('dblclick',function(e){var c=e.target.closest('.card[data-id]');if(c)openStudent(c.dataset.id)});
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='q'){ui.q=e.target.value;renderGrid()}
  else if(id==='stuQ'){ui.stuQ=e.target.value;renderStuBody()}
  else if(id==='recQ'){ui.recQ=e.target.value;ui.recLimit=100;renderRecBody()}
  else if(id==='attQ'){ui.attQ=e.target.value;renderAttChips()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.item){
    var it=D.items.filter(function(i){return i.id===t.dataset.item})[0];if(!it)return;
    var f=t.dataset.f;
    if(f==='d'){
      var v=parseInt(t.value,10);
      if(!v){t.value=it.d;toast('分值不能是 0，正数加分，负数扣分');return}
      it.d=v;t.value=v;t.classList.toggle('neg',v<0);t.classList.toggle('pos',v>0);
    }else{
      var s=t.value.trim();
      if(!s){t.value=it[f]||'';return}
      it[f]=s;
    }
    commit();return;
  }
  if(t.id==='set-name'){var n=t.value.trim();if(n){D.className=n;commit();renderTop();toast('班级名称已保存')}else t.value=D.className}
  else if(t.id==='set-pin'){D.pin=t.value.trim();commit();toast(D.pin?'密码已设置，退出大屏时需要输入':'已取消密码')}
  else if(t.id==='recRv'){ui.recRv=t.checked;renderRecBody()}
  else if(t.id==='attDate'){if(t.value){ui.attDate=t.value;ui.attMonth=t.value.slice(0,7);render()}}
  else if(t.id==='attMonth'){if(t.value){ui.attMonth=t.value;renderAttMon()}}
  else if(t.id==='restoreFile'){
    var file=t.files&&t.files[0];if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){
      var obj=null;
      try{obj=JSON.parse(rd.result)}catch(err){}
      t.value='';
      if(!obj||!Array.isArray(obj.students)||!Array.isArray(obj.logs)){notice('恢复失败','这个文件不是本系统导出的备份，或者文件已经损坏。');return}
      var nd=normalize(obj);
      ask('从备份恢复','备份里有 '+nd.students.length+' 名学生、'+nd.logs.length+' 条积分记录。恢复后会替换现在页面里的所有数据，确定吗？','恢复',true).then(function(ok){
        if(!ok)return;D=nd;ui.sel.clear();ui.attSel.clear();commit();render();toast('已从备份恢复');
      });
    };
    rd.readAsText(file,'utf-8');
  }
});
document.addEventListener('keydown',function(e){
  var top=$('#modal-root').lastElementChild;
  if(e.key==='Escape'&&top){top._close();return}
  if(top)return;
  if(ui.display){
    var views=['all','week','shop'],i=views.indexOf(ui.dview);
    if(e.key==='ArrowRight'){ui.dview=views[(i+1)%3];ui.dflash=null;renderDisplay()}
    else if(e.key==='ArrowLeft'){ui.dview=views[(i+2)%3];ui.dflash=null;renderDisplay()}
    else if(e.key==='1'||e.key==='2'||e.key==='3'){ui.dview=views[Number(e.key)-1];ui.dflash=null;renderDisplay()}
    else if(e.key==='f'||e.key==='F')toggleFull();
    else if(e.key==='Escape')exitDisplay();
    return;
  }
  var tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'){
    if(e.key!=='Enter')return;
    if(e.target.id==='q'){
      var p=pick(ui.q);
      if(p){ui.sel.add(p.id);ui.q='';e.target.value='';renderScoreParts()}
      else if(ui.q.trim())toast('没有找到「'+ui.q+'」');
    }else if(e.target.id==='attQ'){
      var p2=pick(ui.attQ);
      if(p2){ui.attSel.add(p2.id);ui.attQ='';e.target.value='';renderAttChips();renderAttBar()}
    }else if(e.target.id==='cd'||e.target.id==='cl'){A.applyCustom()}
    else if(e.target.id==='newAtt'){A.attTypeAdd()}
    return;
  }
  if(ui.tab==='score'){
    if(e.key==='/'){e.preventDefault();var q=$('#q');if(q)q.focus()}
    else if(e.key==='Escape'&&ui.sel.size){ui.sel.clear();renderScoreParts()}
  }
});
document.getElementById('display').addEventListener('mousemove',showCtrl);
document.getElementById('display').addEventListener('click',showCtrl);
// 拖到投影屏、进出全屏都会变尺寸：上面那几处「放不放得下」要重新量
var rzT=null;
window.addEventListener('resize',function(){
  clearTimeout(rzT);
  rzT=setTimeout(function(){if(ui.display)renderDisplay();else if(ui.tab==='score')renderPanel()},150);
});

/* 多个窗口之间同步（比如大屏开在第二块屏幕上） */
window.addEventListener('storage',function(e){
  if(e.key!==KEY)return;
  var key=ui.dview==='week'?'week':'earned';
  var old=ui.display?st():null;
  D=load();S=null;
  if(ui.display){
    var nw=st(),fl=new Map();
    if(old)nw.forEach(function(t,id){var o=old.get(id);if(o&&t[key]!==o[key])fl.set(id,t[key]-o[key])});
    ui.dflash=fl.size?fl:null;
    renderDisplay();
    setTimeout(function(){ui.dflash=null},2800);
  }else if(!$('#modal-root').lastElementChild){render()}
});

/* ---------- 启动 ---------- */
render();
if(location.hash==='#display')openDisplay(false);
})();
</script>
</body>
