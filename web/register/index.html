<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>蟹记 · 登记收货信息</title>
<style>
:root{
  --shell:#2F4739;--shell-deep:#1C231E;--claw:#C8A227;--boiled:#D2542A;
  --belly:#EFF2EE;--card:#FFF;--line:#DCE2DC;--muted:#6B7670;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--belly);color:var(--shell-deep);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;padding:0 16px 48px;
}
.wrap{max-width:520px;margin:0 auto}
.brand{text-align:center;padding:48px 0 8px;font-size:20px;font-weight:600;letter-spacing:.08em;color:var(--shell)}
h1{font-size:17px;font-weight:400;color:var(--muted);text-align:center;margin:0 0 32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.card h2{font-size:14px;font-weight:600;color:var(--shell);margin:0 0 16px;letter-spacing:.04em}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
.opt{font-weight:400;color:var(--muted)}
input,textarea{
  font:inherit;color:inherit;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;
  letter-spacing:.02em;-webkit-appearance:none;appearance:none;
}
textarea{resize:vertical;min-height:76px;line-height:1.6}
input:focus,textarea:focus{outline:none;border-color:var(--shell)}
input[type=tel],input[type=date]{font-variant-numeric:tabular-nums}
.gap{margin-top:20px}

/* 两类之间单选：按套餐（选一档买整盒）/ 自由搭配（按只挑） */
.seg{display:flex;background:var(--belly);border-radius:10px;padding:3px;margin-bottom:16px}
.seg button{
  flex:1;font:inherit;font-size:14px;padding:9px 0;border:none;border-radius:8px;
  background:none;color:var(--muted);
}
.seg button.on{background:var(--card);color:var(--shell);font-weight:600;box-shadow:0 1px 3px rgba(28,35,30,.14)}

.pane{display:none}
.pane.on{display:block}

/* 套餐：一档一行，单选 */
.pack{
  display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;padding:11px 12px;
  font:inherit;color:inherit;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
}
.pack.on{border-color:var(--shell);background:rgba(47,71,57,.06)}
.pack .dot{
  flex:none;width:15px;height:15px;border-radius:50%;box-sizing:border-box;
  border:1.5px solid var(--line);background:var(--card);
}
.pack.on .dot{border:5px solid var(--shell)}
.pack .body{flex:1;min-width:0}
.pack .t{display:block;font-size:14px;line-height:1.4}
.pack .p{display:block;font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.pack .amt{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

/* 套餐下面的两行：几盒、每盒公母 */
.line-row{display:flex;align-items:center;gap:12px;margin-top:12px}
.line-row .lab{flex:1;min-width:0;font-size:14px}
.line-row .lab.sub{font-size:13px;color:var(--muted)}
.line-row .lab b{font-weight:600;color:var(--shell-deep);font-variant-numeric:tabular-nums}
.divide{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}

/* 自由搭配：四档 × 公母共八行。同档公母同价，两行挨着放 */
.grp{border-top:1px solid var(--line);padding:10px 0}
.grp:first-of-type{border-top:none}
.pick{display:flex;align-items:center;gap:10px}
.pick + .pick{margin-top:8px}
.pick .nm{flex:1;min-width:0;font-size:14px}
.pick .pr{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--shell);margin-top:8px;font-variant-numeric:tabular-nums}

/* 加减器。自由搭配那八行用小一号的，免得和套餐的「几盒」分不清主次 */
.step{display:flex;align-items:center;gap:2px}
.step button{
  width:32px;height:32px;padding:0;margin:0;border-radius:8px;
  border:1px solid var(--line);background:var(--card);color:var(--shell);
  font:inherit;font-size:18px;line-height:1;font-weight:400;
}
.step button:disabled{opacity:.3}
.step .n{width:40px;text-align:center;font-variant-numeric:tabular-nums;font-size:16px}
.step .n.zero{color:var(--muted)}
.step--sm button{width:30px;height:30px;font-size:17px}
.step--sm .n{width:28px;font-size:15px}

/* 两类选的东西合在一张单里，各自一行摆出来——
   不然你在「自由搭配」页签上看不见套餐那边选了什么，只看到合计莫名多出几百块 */
.bd{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-top:10px}
.bd:first-child{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.bd .k{flex:1;min-width:0;color:var(--muted)}
.bd .v{font-variant-numeric:tabular-nums}

.sum{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
}
.sum .k{font-size:13px;color:var(--muted)}
.sum .cnt{font-variant-numeric:tabular-nums}
.sum .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}

button.go{
  font:inherit;font-weight:600;color:#fff;background:var(--shell);
  border:none;border-radius:12px;padding:14px;width:100%;margin-top:8px;
}
button.go:disabled{opacity:.45}
.err{color:var(--boiled);font-size:14px;margin-top:16px;text-align:center;min-height:20px}
/* 选货那档的错误贴着合计显示，不要甩到页尾的提交按钮下面——
   买家看见提示时，要改的东西就在眼前 */
.err--inline{margin-top:10px;text-align:left;min-height:0}
.err--inline:empty{display:none}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}

/* 回执 */
.done{display:none}
.done.on{display:block}
.form.off{display:none}
.tick{width:44px;height:44px;border-radius:50%;background:var(--shell);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:22px;margin:4px auto 16px}
.done .no{font-variant-numeric:tabular-nums;letter-spacing:.02em;font-size:20px;font-weight:600;text-align:center}
.done .cap{text-align:center;color:var(--muted);font-size:13px;margin-top:6px}
.kv{display:flex;justify-content:space-between;gap:16px;margin-top:12px;font-size:15px}
.kv .k{color:var(--muted);font-size:14px;flex:none}
.kv .v{text-align:right;font-variant-numeric:tabular-nums}
.done .line{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);line-height:1.7}
.done a{color:var(--shell)}
.dead{text-align:center;color:var(--muted);font-size:15px;line-height:1.8;padding:8px 0}
@media (prefers-reduced-motion:no-preference){.done.on{animation:in .2s ease-out}}
@keyframes in{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">蟹记</div>
  <h1 id="sub">登记一下收货信息</h1>

  <div class="form" id="form">
    <div class="card" id="specCard">
      <h2>要什么蟹</h2>

      <div class="seg" id="seg">
        <button type="button" class="on" id="tabPack">按套餐</button>
        <button type="button" id="tabFree">自由搭配</button>
      </div>

      <div id="loading" class="dead">正在取当季的价目…</div>

      <div class="pane on" id="panePack">
        <div id="packs"></div>
        <div class="line-row divide">
          <span class="lab">要几盒</span>
          <div class="step">
            <button type="button" id="boxMinus" aria-label="少一盒">−</button>
            <span class="n" id="boxNum">1</span>
            <button type="button" id="boxPlus" aria-label="多一盒">+</button>
          </div>
        </div>
        <div class="hint" style="margin-top:10px">整盒默认公母各一半。想自己配比例，去「自由搭配」按只挑，同一档凑满一盒照样按整盒价算。</div>
      </div>

      <div class="pane" id="paneFree">
        <div class="hint" style="margin:0 0 8px">按只挑，公母随便配，一共 <b id="minNum">5</b> 只起。<br>同一档凑满一盒自动按整盒价算。</div>
        <div id="picks"></div>
      </div>

      <div id="breakdown"></div>
      <div class="sum">
        <span class="k">货款合计 <span class="cnt" id="count"></span></span>
        <span class="v" id="total">¥0.00</span>
      </div>
      <div class="err err--inline" id="pickErr"></div>
      <div class="hint" id="hint">按当季价算的货款，不含运费。运费和最终费用等发出后确认。</div>
    </div>

    <div class="card">
      <h2>收货信息</h2>
      <label for="name">收货人</label>
      <input id="name" maxlength="32" autocomplete="name" placeholder="怎么称呼">

      <div class="gap">
        <label for="phone">手机号</label>
        <input id="phone" type="tel" inputmode="numeric" maxlength="11" autocomplete="tel" placeholder="11 位手机号">
      </div>

      <div class="gap">
        <label for="addr">收货地址</label>
        <textarea id="addr" maxlength="200" autocomplete="street-address" placeholder="省 / 市 / 区 + 详细地址，门牌号写全"></textarea>
      </div>

      <div class="gap">
        <label for="nick">微信昵称 <span class="opt">（选填，方便对上人）</span></label>
        <input id="nick" maxlength="32" placeholder="微信里显示的名字">
      </div>

      <div class="gap">
        <label for="date">希望哪天发 <span class="opt">（选填）</span></label>
        <input id="date" type="date">
      </div>

      <div class="gap">
        <label for="remark">留一句话 <span class="opt">（选填）</span></label>
        <input id="remark" maxlength="200" placeholder="比如：工作日收不到，周末发">
      </div>

      <button class="go" type="button" id="go">提交登记</button>
      <div class="err" id="err"></div>
    </div>
  </div>

  <div class="card done" id="done"></div>
  <div class="foot">蟹记</div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id) }
  var errEl = $('err'), goEl = $('go'), doneEl = $('done'), formEl = $('form')

  // 链接里的 token 是唯一的入场券，服务端签的，页面只负责原样带回去
  var token = (new URLSearchParams(location.search).get('t') || '').trim()

  var specs = []    // 后端 /api/public/specs 的原样数据
  var tab = 'pack'  // pack=按套餐 / free=自由搭配，两类之间单选
  var picked = null // 按套餐选中的那一档
  var boxes = 1     // 按套餐要几盒
  var free = {}     // 自由搭配：spec_id -> {f: 母几只, m: 公几只}
  var minQty = 0    // 整单起订只数，跟着价目表一起从后端拿，不在这儿写死

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    })
  }

  // 金额一律是「分」的整数，分转元走整数运算，不碰浮点
  function yuan(cents) {
    var n = Math.round(cents)
    var sign = n < 0 ? '-' : ''
    n = Math.abs(n)
    var f = n % 100
    return sign + '¥' + Math.floor(n / 100) + '.' + (f < 10 ? '0' + f : f)
  }

  function todayStr() {
    var d = new Date()
    var p = function (n) { return n < 10 ? '0' + n : '' + n }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
  }

  function fmtDay(v) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || ''))
    return m ? (+m[2]) + '月' + (+m[3]) + '日' : String(v || '')
  }

  function request(method, url, body, cb) {
    var req = new XMLHttpRequest()
    req.open(method, url, true)
    req.timeout = 15000
    if (body) req.setRequestHeader('Content-Type', 'application/json')
    req.onload = function () {
      var parsed
      try { parsed = JSON.parse(req.responseText) } catch (x) { parsed = null }
      cb(null, parsed)
    }
    req.onerror = req.ontimeout = function () { cb(new Error('network')) }
    req.send(body ? JSON.stringify(body) : null)
  }

  // ---------- 价目 ----------

  // 两条路：按套餐（选一档买整盒）与自由搭配（按只挑）。
  // 切换只换显示，不清空另一边填过的东西；提交只看当前这一边。
  function setTab(next) {
    tab = next
    var onPack = tab === 'pack'
    $('tabPack').className = onPack ? 'on' : ''
    $('tabFree').className = onPack ? '' : 'on'
    $('panePack').className = 'pane' + (onPack ? ' on' : '')
    $('paneFree').className = 'pane' + (onPack ? '' : ' on')
    fail('')
    total()
  }

  function packById(id) {
    for (var i = 0; i < specs.length; i++) {
      if (String(specs[i].id) === String(id)) return specs[i]
    }
    return null
  }

  // 套餐名里已经写了盒里装什么，不再加「公母」前缀，那个前缀说不出任何东西
  function packName(s) {
    return s.pack_size > 0 ? s.spec_label : s.gender_text + s.spec_label
  }

  // ---------- 按套餐 ----------

  function renderPacks() {
    var html = ''
    for (var i = 0; i < specs.length; i++) {
      var s = specs[i]
      var on = String(s.id) === String(picked)
      var sub = s.pack_size > 0
        ? s.pack_size + ' 只装　散买 ' + yuan(s.loose_price) + ' / 只'
        : yuan(s.unit_price) + ' / ' + s.unit_text
      html +=
        '<button type="button" class="pack' + (on ? ' on' : '') + '" data-id="' + s.id + '" aria-pressed="' + on + '">' +
          '<span class="dot"></span>' +
          '<span class="body">' +
            '<span class="t">' + esc(packName(s)) + '</span>' +
            '<span class="p">' + esc(sub) + '</span>' +
          '</span>' +
          '<span class="amt">' + esc(yuan(s.unit_price)) + '</span>' +
        '</button>'
    }
    $('packs').innerHTML = html
    var btns = $('packs').getElementsByTagName('button')
    for (var k = 0; k < btns.length; k++) {
      btns[k].addEventListener('click', function () {
        picked = this.getAttribute('data-id')
        renderPacks()
        total()
      })
    }
  }

  // 套餐只选几盒。整盒的公母一律各一半——想自己配比例就去自由搭配按只挑，
  // 同一档凑满一盒照样按整盒价算，不用在这儿再放一组加减器。
  function syncBoxes() {
    pickFail('')
    setText('boxNum', boxes)
    $('boxMinus').disabled = boxes <= 1
  }

  // ---------- 自由搭配 ----------

  // 八行：四档 × 公母。同档公母同价，两行挨着放，一眼看出是一个价。
  function renderPicks() {
    var html = ''
    for (var i = 0; i < specs.length; i++) {
      var s = specs[i]
      if (!s.pack_size) continue
      var parts = splitLabel(s.spec_label)
      html +=
        '<div class="grp">' +
          pickRow(s, 'f', parts.female) +
          pickRow(s, 'm', parts.male) +
          '<div class="note" id="note' + s.id + '"></div>' +
        '</div>'
    }
    $('picks').innerHTML = html

    var btns = $('picks').getElementsByTagName('button')
    for (var k = 0; k < btns.length; k++) {
      btns[k].addEventListener('click', function () {
        bump(this.getAttribute('data-id'), this.getAttribute('data-k'), +this.getAttribute('data-d'))
      })
    }
    for (var j = 0; j < specs.length; j++) refreshGroup(specs[j].id)
  }

  function pickRow(s, kind, label) {
    return '<div class="pick">' +
      '<span class="nm">' + esc(label) + '</span>' +
      '<span class="pr">' + esc(yuan(s.loose_price)) + ' / 只</span>' +
      '<div class="step step--sm">' +
        '<button type="button" data-id="' + s.id + '" data-k="' + kind + '" data-d="-1" aria-label="减少" disabled>−</button>' +
        '<span class="n zero" id="' + kind + s.id + '">0</span>' +
        '<button type="button" data-id="' + s.id + '" data-k="' + kind + '" data-d="1" aria-label="增加">+</button>' +
      '</div>' +
    '</div>'
  }

  // 从「8只装 母2.5两/公3.5两」里拆出两种规格的名字。
  // 拆不出来就退回「母 / 公」，宁可糙一点也别显示成空白。
  function splitLabel(label) {
    var m = /(母[\d.]+两)\s*[\/／]\s*(公[\d.]+两)/.exec(String(label || ''))
    if (m) return { female: m[1], male: m[2] }
    var m2 = /(公[\d.]+两)\s*[\/／]\s*(母[\d.]+两)/.exec(String(label || ''))
    if (m2) return { female: m2[2], male: m2[1] }
    return { female: '母', male: '公' }
  }

  function countsOf(id) {
    if (!free[id]) free[id] = { f: 0, m: 0 }
    return free[id]
  }

  var MAX = 200

  function bump(id, kind, d) {
    var c = countsOf(id)
    var key = kind === 'f' ? 'f' : 'm'
    var v = c[key] + d
    if (v < 0) v = 0
    if (v > MAX) v = MAX
    c[key] = v
    refreshGroup(id)
    total()
  }

  // 只改这一档的两个数字与提示，不重建整个列表：重建会让刚点的按钮换一个 DOM 节点，
  // 连点时焦点和触摸态都会丢。
  function refreshGroup(id) {
    var s = packById(id)
    if (!s || !s.pack_size) return
    var c = countsOf(id)
    setNum('f' + id, c.f)
    setNum('m' + id, c.m)

    var box = $('note' + id)
    if (!box) return
    var boxCount = Math.floor((c.f + c.m) / s.pack_size)
    if (boxCount > 0) {
      var saved = boxCount * (s.pack_size * s.loose_price - s.unit_price)
      box.textContent = saved > 0
        ? '这档凑满 ' + boxCount + ' 盒，按整盒价算，省 ' + yuan(saved)
        : '这档凑满 ' + boxCount + ' 盒，按整盒价算'
    } else {
      box.textContent = ''
    }
  }

  function setNum(id, v) {
    var el = $(id)
    if (!el) return
    el.textContent = v
    el.className = 'n' + (v ? '' : ' zero')
    var minus = el.parentNode.getElementsByTagName('button')[0]
    if (minus) minus.disabled = !v
  }

  // ---------- 金额 ----------

  // 一档买 n 只怎么算钱：整盒走套餐价，零头走散买价。和后端 splitPack 同一套算法，
  // 两边算不一样的话，回执金额和页面显示就对不上。
  function amountOf(s, n) {
    if (!s.pack_size) return n * s.unit_price
    var boxCount = Math.floor(n / s.pack_size)
    var loose = n % s.pack_size
    return boxCount * s.unit_price + loose * s.loose_price
  }

  // 两类选的东西合在一张单里：买 2 盒再加几只散的是常事，不该逼买家二选一。
  // 同一档的整盒与散只分成两条 item 发给后端——后端按整盒价 + 散买价各算各的，
  // 和合并成一条再拆的结果完全一样（8a+b 只拆出来就是 a 盒加 b 只）。
  function packPick() {
    var out = { crabs: 0, amount: 0, items: [], label: '' }
    var s = packById(picked)
    if (!s || !boxes) return out
    var size = s.pack_size || 1
    out.crabs = boxes * size
    out.amount = boxes * s.unit_price
    out.items.push({ spec_id: s.id, quantity: out.crabs })
    out.label = packName(s) + ' ×' + boxes + (s.pack_size ? ' 盒' : ' ' + s.unit_text)
    return out
  }

  function freePick() {
    var out = { crabs: 0, amount: 0, items: [] }
    for (var i = 0; i < specs.length; i++) {
      var sp = specs[i]
      if (!sp.pack_size) continue
      var c = countsOf(sp.id)
      var n = c.f + c.m
      if (!n) continue
      out.crabs += n
      out.amount += amountOf(sp, n)
      out.items.push({ spec_id: sp.id, quantity: n, male_count: c.m })
    }
    return out
  }

  function allPicks() {
    var p = packPick()
    var f = freePick()
    return {
      pack: p,
      free: f,
      crabs: p.crabs + f.crabs,
      amount: p.amount + f.amount,
      items: mergeItems(p.items.concat(f.items))
    }
  }

  // 同一档在两边都选了就合成一条，否则明细会出现两行一模一样的 ×1，
  // 卖家配货时得自己把它们加起来。金额不受影响：8a+b 只拆出来还是 a 盒加 b 只。
  function mergeItems(items) {
    var byId = {}
    var order = []
    for (var i = 0; i < items.length; i++) {
      var it = items[i]
      var key = String(it.spec_id)
      if (!byId[key]) {
        byId[key] = { spec_id: it.spec_id, quantity: 0, male_count: 0 }
        order.push(key)
      }
      byId[key].quantity += it.quantity
      byId[key].male_count += maleOfItem(it)
    }
    var out = []
    for (var k = 0; k < order.length; k++) out.push(byId[order[k]])
    return out
  }

  // 没写 male_count 的（套餐那条）按后端的默认值算：一半一半。
  // 合并后要显式写出来，不然后端会按合并后的总数再取一半，和分开时不一定一样。
  function maleOfItem(it) {
    if (it.male_count != null) return it.male_count
    return Math.floor(it.quantity / 2)
  }

  function total() {
    pickFail('')
    var all = allPicks()

    // 分项写出来：在自由搭配页签上也要看得见套餐那边选了什么，
    // 否则合计凭空多出几百块，买家不知道哪来的
    var html = ''
    if (all.pack.crabs) {
      html += '<div class="bd"><span class="k">套餐　' + esc(all.pack.label) + '</span>' +
              '<span class="v">' + esc(yuan(all.pack.amount)) + '</span></div>'
    }
    if (all.free.crabs) {
      html += '<div class="bd"><span class="k">散买　共 ' + all.free.crabs + ' 只</span>' +
              '<span class="v">' + esc(yuan(all.free.amount)) + '</span></div>'
    }
    // 只有一类时不用分项，合计那行已经说完了
    $('breakdown').innerHTML = (all.pack.crabs && all.free.crabs) ? html : ''

    $('total').textContent = yuan(all.amount)
    $('count').textContent = all.crabs > 0 ? '· 共 ' + all.crabs + ' 只' : ''
  }

  function setText(id, v) { var el = $(id); if (el) el.textContent = v }

  function loadSpecs() {
    request('GET', '/api/public/specs', null, function (e, body) {
      if (e || !body || body.code !== 0 || !body.data) {
        $('loading').textContent = '价目没取到，刷新一下试试'
        return
      }
      specs = body.data.list || []
      minQty = body.data.min_quantity || 0
      if (!specs.length) {
        $('loading').textContent = '这会儿没有可登记的档，问一下再来'
        return
      }
      $('loading').style.display = 'none'
      setText('minNum', minQty)

      picked = defaultPackId()
      renderPacks()
      syncBoxes()
      renderPicks()
      total()
    })
  }

  // 默认落在第二档（¥269 那一档）：它是主推的，多数人不用动就能往下填。
  // 价目表只有一档时就落在第一档。
  function defaultPackId() {
    var packs = []
    for (var i = 0; i < specs.length; i++) {
      if (specs[i].pack_size > 0) packs.push(specs[i])
    }
    if (!packs.length) return specs[0].id
    return (packs.length > 1 ? packs[1] : packs[0]).id
  }

  // ---------- 提交 ----------

  function submit() {
    var cur = allPicks()
    var name = $('name').value.trim()
    var phone = $('phone').value.trim()
    var addr = $('addr').value.trim()

    if (!cur.items.length) { pickFail('先选一下要什么'); return }
    if (minQty > 0 && cur.crabs < minQty) {
      pickFail('一共 ' + minQty + ' 只起，还差 ' + (minQty - cur.crabs) + ' 只')
      return
    }
    if (!name) { fail('收货人还没填'); return }
    if (!/^1[3-9]\d{9}$/.test(phone)) { fail('手机号看着不对，检查一下'); return }
    if (addr.length < 5) { fail('地址写详细一点，门牌号别漏'); return }

    errEl.textContent = ''
    goEl.disabled = true
    goEl.textContent = '提交中'

    request('POST', '/api/public/registrations', {
      token: token,
      receiver_name: name,
      phone: phone,
      address: addr,
      wechat_nick: $('nick').value.trim(),
      items: cur.items,
      expect_ship_date: $('date').value || '',
      remark: $('remark').value.trim()
    }, function (e, body) {
      goEl.disabled = false
      goEl.textContent = '提交登记'
      if (e) { fail('网络不太好，再试一次'); return }
      if (!body) { fail('提交失败，等会儿再试'); return }
      if (body.code === 0 && body.data) { receipt(body.data); return }
      // 后端的 msg 都是写给买家看的话，直接显示
      fail(body.msg || '提交失败，等会儿再试')
    })
  }

  function fail(msg) { errEl.textContent = msg }

  // 选货相关的提示贴着合计显示，并且一动就清掉，免得留着一句过时的红字
  function pickFail(msg) { $('pickErr').textContent = msg || '' }

  // ---------- 回执 ----------

  function receipt(d) {
    var html =
      '<div class="tick">✓</div>' +
      '<div class="no">' + esc(d.order_no) + '</div>' +
      '<div class="cap">' + (d.idempotent ? '这条链接之前已经登记过了，就是这一单' : '登记好了，稍后跟你确认') + '</div>' +
      '<div class="kv"><span class="k">收货人</span><span class="v">' + esc(d.receiver_name) + '</span></div>' +
      '<div class="kv"><span class="k">规格</span><span class="v">' + esc(d.items_summary) + '</span></div>' +
      // 这里显示的是后端算出来的应收，不是页面上那个预估
      '<div class="kv"><span class="k">货款</span><span class="v">' + esc(yuan(d.payable_amount)) + '</span></div>' +
      (d.expect_ship_date ? '<div class="kv"><span class="k">希望发货</span><span class="v">' + esc(fmtDay(d.expect_ship_date)) + '</span></div>' : '') +
      '<div class="line">' +
        '单号记一下，或者截个图。<br>' +
        '运费和最终费用等发出后确认。<br>' +
        '发货之后可以在 <a href="/t?no=' + encodeURIComponent(d.order_no) + '">这里查物流</a>（要填手机后四位）。' +
      '</div>'
    doneEl.innerHTML = html
    doneEl.className = 'card done on'
    formEl.className = 'form off'
    $('sub').textContent = '登记完成'
    window.scrollTo(0, 0)
  }

  // ---------- 起手 ----------

  if (!token) {
    formEl.className = 'form off'
    doneEl.innerHTML = '<div class="dead">这条链接不完整，<br>重新要一条吧</div>'
    doneEl.className = 'card done on'
    $('sub').textContent = '链接有点问题'
    return
  }

  // 希望发货日期不能往回填，后端也会拦
  $('date').min = todayStr()

  $('tabPack').addEventListener('click', function () { setTab('pack') })
  $('tabFree').addEventListener('click', function () { setTab('free') })
  $('boxMinus').addEventListener('click', function () {
    if (boxes > 1) { boxes -= 1; syncBoxes(); total() }
  })
  $('boxPlus').addEventListener('click', function () {
    if (boxes < 99) { boxes += 1; syncBoxes(); total() }
  })

  goEl.addEventListener('click', submit)
  loadSpecs()
})()
</script>
</body>
</html>
