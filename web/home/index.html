<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>蟹记</title>
<style>
:root{
  --shell:#2F4739;--shell-deep:#1C231E;
  --belly:#EFF2EE;--muted:#6B7670;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--belly);color:var(--shell-deep);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;padding:0 16px;
  display:flex;flex-direction:column;min-height:100%;
}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.brand{font-size:24px;font-weight:600;letter-spacing:.08em;color:var(--shell)}
p{color:var(--muted);font-size:14px;margin:8px 0 0}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:24px 0 32px}
.foot a{color:inherit;text-decoration:none}
</style>
</head>
<body>
<main>
  <div class="brand">蟹记</div>
  <p>个人大闸蟹订单记录工具</p>
</main>
<div class="foot"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">ICP备2026003464号</a></div>
</body>
</html>
